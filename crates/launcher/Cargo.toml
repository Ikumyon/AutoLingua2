[package]
name = "autolingua-launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = "1"
autolingua2-native = { path = "../autolingua2-native", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[build-dependencies]
slint-build = "1"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
