[package]
name = "autolingua2-native"
version = "0.1.0"
edition = "2021"

[lib]
name = "autolingua2_native"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:chardetng", "dep:encoding_rs"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }
chardetng = { version = "0.1", optional = true }
encoding_rs = { version = "0.8", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
