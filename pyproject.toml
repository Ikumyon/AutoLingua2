[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autolingua2"
dynamic = ["version"]
description = "Paradox localization translation editor"
requires-python = ">=3.14,<3.16"
dependencies = [
    "PySide6>=6.12.0",
    "PyYAML",
    "cryptography",
]

[project.scripts]
autolingua2 = "autolingua2.app:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.pyright]
extraPaths = ["src"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}
