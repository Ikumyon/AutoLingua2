name: Build desktop

on:
  push:
    branches: [main]
    paths-ignore:
      - 'guide/**'
      - '**/*.md'
      - '.github/workflows/guide-pages.yml'
  pull_request:
    paths-ignore:
      - 'guide/**'
      - '**/*.md'
      - '.github/workflows/guide-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libwayland-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb1-dev libegl1-mesa-dev libgl1-mesa-dev libinput-dev libudev-dev libssl-dev libglib2.0-0t64 libdbus-1-3 libnss3 libasound2t64 libxcomposite1 libxdamage1 libxrandr2 libxtst6
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: desktop-${{ runner.os }}-python314-${{ hashFiles('Cargo.lock', 'crates/**/Cargo.toml') }}
      - name: Install Python dependencies
        run: |
          python -c "import subprocess,sys,tomllib; deps=tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']; subprocess.run([sys.executable,'-m','pip','install',*deps,'pyinstaller'],check=True)"
      - name: Build chat frontend
        working-directory: web
        run: |
          npm install --include=peer --no-package-lock --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Rust components
        run: |
          $env:PYO3_PYTHON = (Get-Command python).Source
          foreach ($package in @('autolingua2-native', 'autolingua-launcher', 'autolingua-source-watcher', 'autolingua-updater')) {
            cargo build --locked --release -p $package
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          New-Item -ItemType Directory -Path build/native -Force | Out-Null
          if ($IsWindows) {
            Copy-Item target/release/autolingua2_native.dll build/native/autolingua2_native.pyd
          } else {
            Copy-Item target/release/libautolingua2_native.so build/native/autolingua2_native.so
          }
          $env:PYTHONPATH = (Resolve-Path build/native).Path
          python -c "import autolingua2_native"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile Qt resources and package Python application
        run: |
          $uic = (Get-Command pyside6-uic).Source
          Get-ChildItem ui -Recurse -Filter *.ui | ForEach-Object {
            python scripts/python/compile_ui.py $_.FullName $uic
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Get-ChildItem translations -Recurse -Filter *.ts | ForEach-Object {
            pyside6-lrelease $_.FullName -qm ([IO.Path]::ChangeExtension($_.FullName, '.qm'))
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $env:PYTHONPATH = (Resolve-Path build/native).Path
          python -m PyInstaller --noconfirm AUTOlingua2.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assemble and verify distribution
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          New-Item -ItemType Directory -Path dist/AUTOlingua2 -Force | Out-Null
          Move-Item dist/core dist/AUTOlingua2/core
          Copy-Item "target/release/autolingua-launcher$suffix" "dist/AUTOlingua2/AUTOlingua2$suffix"
          foreach ($name in @('autolingua-source-watcher', 'autolingua-updater')) {
            Copy-Item "target/release/$name$suffix" "dist/AUTOlingua2/core/$name$suffix"
          }
          foreach ($directory in @('theme', 'plugins', 'translations', 'splash')) {
            if (Test-Path $directory -PathType Container) { Copy-Item $directory dist/AUTOlingua2 -Recurse }
          }
          foreach ($file in @("AUTOlingua2$suffix", "core/autolingua2_core$suffix", "core/autolingua-source-watcher$suffix", "core/autolingua-updater$suffix", 'core/_internal/assets/chat/index.html')) {
            if (-not (Test-Path "dist/AUTOlingua2/$file" -PathType Leaf)) { throw "Missing build output: $file" }
          }
          if (-not $IsWindows) {
            tar -czf dist/AUTOlingua2-linux.tar.gz -C dist AUTOlingua2
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: AUTOlingua2-${{ runner.os }}
          path: |
            ${{ runner.os == 'Windows' && 'dist/AUTOlingua2/' || 'dist/AUTOlingua2-linux.tar.gz' }}
          if-no-files-found: error
          retention-days: 7
