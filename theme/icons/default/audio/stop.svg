<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
  <title>stop</title>
  <defs>
    <linearGradient id="stopGrad" x1="4" y1="4" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7875"/>
      <stop offset="0.55" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#be123c"/>
    </linearGradient>
    <radialGradient id="stopHighlight" cx="8" cy="7" r="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fecdd3" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fecdd3" stop-opacity="0"/>
